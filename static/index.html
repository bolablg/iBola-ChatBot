<body>
    <div class="chat-app" id="chat-app">
        <!-- Header -->
        <header class="chat-header" role="banner">
            <div class="header-brand">
                <img class="brand-mark" src="/static/logo.svg" alt="iBola" width="28" height="28">
                <div class="brand-text">
                    <span class="brand-name">iBola</span>
                    <div class="brand-status">
                        <span class="status-dot" aria-hidden="true"></span>
                        <span>AI Assistant</span>
                    </div>
                </div>
            </div>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </header>

        <!-- Main scrollable area -->
        <main class="chat-main" id="chat-main" role="log" aria-label="Chat messages" aria-live="polite">
            <!-- Welcome Screen -->
            <div id="welcome-screen">
                <img class="welcome-avatar" src="/static/logo.svg" alt="iBola Assistant">
                <h1 class="welcome-title" id="welcome-title">How can I help you?</h1>
                <p class="welcome-subtitle" id="welcome-subtitle">Ask me anything about Bolaji's professional life</p>
                <div class="suggestions-grid" id="suggestions-grid"></div>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chat-messages">
                <div class="typing-indicator" id="typing-indicator" aria-label="Assistant is typing">
                    <img class="typing-avatar" src="/static/logo.svg" alt="" width="28" height="28">
                    <div class="typing-dots">
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                        <span class="typing-dot"></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Input -->
        <footer class="chat-input-area" role="form">
            <div class="input-wrapper">
                <form class="input-row" id="chat-form" autocomplete="off">
                    <textarea
                        id="user-input"
                        rows="1"
                        placeholder=""
                        aria-label="Type your message"
                        maxlength="1000"
                        autocomplete="off"
                    ></textarea>
                    <button class="send-btn" type="submit" aria-label="Send message">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </form>
                <div class="powered-by">
                    Built by <a href="https://bolablg.com" target="_blank" rel="noopener">Bolaji BALOGOUN</a>
                </div>
            </div>
        </footer>
