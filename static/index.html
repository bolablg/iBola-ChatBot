<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBola Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>iBola Assistant</h2>
            <div class="mode-toggle" id="mode-toggle">🌙</div>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <span></span><span></span><span></span>
            </div>
        </div>
        <form class="chat-input-form" id="chat-form">
            <input type="text" id="user-input" placeholder="What do you have in mind ?">
            <button type="submit">&#x2191;</button>
        </form>
    </div>
    <script src="/static/script.js"></script>

    <!-- The Modal -->
    <div id="appointment-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close-btn">&times;</span>
            <iframe id="modal-iframe" src="" frameborder="0"></iframe>
        </div>
    </div>
</body>
</html>
