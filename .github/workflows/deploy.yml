name: Test and Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linting
        run: |
          # Check code formatting
          black --check --diff app/ tests/
          # Check import sorting
          isort --check-only --diff app/ tests/
          # Run static analysis
          flake8 app/ tests/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Run unit tests
        env:
          GEMINI_API_KEY: test_key_placeholder
          GCHAT_WEBHOOK_URL: https://test-webhook.com
          GCP_PROJECT_ID: test-project
          REDIRECT_LOG_SHEET_ID: test_sheet_id_placeholder
        run: |
          pytest tests/test_agents.py tests/test_services.py -v --cov=app --cov-report=xml --cov-report=term

      - name: Run integration tests
        env:
          GEMINI_API_KEY: test_key_placeholder
          GCHAT_WEBHOOK_URL: https://test-webhook.com
          GCP_PROJECT_ID: test-project
          REDIRECT_LOG_SHEET_ID: test_sheet_id_placeholder
        run: |
          pytest tests/test_integration.py -v --cov-append --cov-report=xml

      - name: Run security tests
        env:
          GEMINI_API_KEY: test_key_placeholder
          GCHAT_WEBHOOK_URL: https://test-webhook.com
          GCP_PROJECT_ID: test-project
          REDIRECT_LOG_SHEET_ID: test_sheet_id_placeholder
        run: |
          pytest tests/test_security.py -v --cov-append --cov-report=xml

      - name: Run performance tests
        env:
          GEMINI_API_KEY: test_key_placeholder
          GCHAT_WEBHOOK_URL: https://test-webhook.com
          GCP_PROJECT_ID: test-project
          REDIRECT_LOG_SHEET_ID: test_sheet_id_placeholder
        run: |
          pytest tests/test_performance.py -v --cov-append --cov-report=xml

      - name: Generate test reports
        run: |
          # Generate HTML coverage report
          coverage html
          # Generate test results summary
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests**: $(pytest tests/test_agents.py tests/test_services.py --collect-only -q | wc -l) tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Integration Tests**: $(pytest tests/test_integration.py --collect-only -q | wc -l) tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Tests**: $(pytest tests/test_security.py --collect-only -q | wc -l) tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Tests**: $(pytest tests/test_performance.py --collect-only -q | wc -l) tests" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test artifacts
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            htmlcov/
            .coverage
          retention-days: 30

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create OAuth credentials file
        run: |
          echo "${{ secrets.GOOGLE_OAUTH_KEY }}" > ${{ secrets.GOOGLE_OAUTH_KEY_PATH }}
          echo "GOOGLE_OAUTH_CREDENTIALS_PATH=${{ secrets.GOOGLE_OAUTH_KEY_PATH }}" >> $GITHUB_ENV

      - name: Create GCP SA credentials file
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > ${{ secrets.GCP_SA_KEY_PATH }}
          echo "GCP_SA_CREDENTIALS_PATH=${{ secrets.GCP_SA_KEY_PATH }}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Create GOOGLE OAUTH Token
        run: |
          echo "${{ secrets.GOOGLE_OAUTH_TOKEN }}" > ${{ secrets.GOOGLE_OAUTH_TOKEN_PATH }}

      - name: Build and push Docker image
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/ibola-chatbot

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ibola-chatbot \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/ibola-chatbot \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_OAUTH_CREDENTIALS_PATH=${{ env.GOOGLE_OAUTH_CREDENTIALS_PATH }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" \
            --set-env-vars "GDRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID }}" \
            --set-env-vars "GCHAT_WEBHOOK_URL=${{ secrets.GCHAT_WEBHOOK_URL }}" \
            --set-env-vars "DATA_PATH=${{ secrets.DATA_PATH }}" \
            --set-env-vars "DB_PATH=${{ secrets.DB_PATH }}" \
            --set-env-vars "REDIRECT_LOG_SHEET_ID=${{ secrets.REDIRECT_LOG_SHEET_ID }}" \
            --set-env-vars "GCP_SA_CREDENTIALS_PATH=${{ env.GCP_SA_CREDENTIALS_PATH }}"

      - name: Install beta component
        run: |
          gcloud components install beta --quiet

      - name: Map custom domain
        run: |
          gcloud beta run domain-mappings create --quiet \
            --service=ibola-chatbot \
            --domain=chat.bolablg.com \
            --region=us-central1