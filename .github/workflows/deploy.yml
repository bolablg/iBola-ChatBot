name: Test and Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create OAuth credentials file
        run: |
          echo "${{ secrets.GOOGLE_OAUTH_KEY }}" > _conf/ibola_agent_oauth.json
          echo "GOOGLE_OAUTH_CREDENTIALS_PATH=$(pwd)/_conf/ibola_agent_oauth.json" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Create GOOGLE OAUTH Token
        run: |
          echo "${{ secrets.GOOGLE_OAUTH_TOKEN }}" > _conf/token.json

      - name: Build and push Docker image
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/ibola-chatbot

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ibola-chatbot \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/ibola-chatbot \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_OAUTH_CREDENTIALS_PATH=${{ env.GOOGLE_OAUTH_CREDENTIALS_PATH }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" \
            --set-env-vars "GDRIVE_FOLDER_ID=${{ secrets.GDRIVE_FOLDER_ID }}" \
            --set-env-vars "GCHAT_WEBHOOK_URL=${{ secrets.GCHAT_WEBHOOK_URL }}" \
            --set-env-vars "DATA_PATH=${{ secrets.DATA_PATH }}" \
            --set-env-vars "DB_PATH=${{ secrets.DB_PATH }}"

      - name: Map custom domain
        run: |
          gcloud beta run domain-mappings create \
            --service=ibola-chatbot \
            --domain=bolablg.com \
            --region=us-central1