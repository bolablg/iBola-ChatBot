name: CI/CD Pipeline — Lint → Test → Stage → Security → Deploy

# ============================================================
# Flow:
#   Feature branch (push) → lint + format + test → auto-merge to staging
#   Staging (on push)      → security scan → auto-create PR to main
#   Main (on push / PR)    → deploy to Cloud Run (production)
# ============================================================

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  schedule:
    # Weekly production smoke: golden-QA subset against the live service.
    - cron: '0 6 * * 1'
    # Nightly full golden-set eval (PART 5 C4: the full set must run
    # somewhere; smoke subsets alone hide tail regressions).
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOB 1: Lint + Format + Test (ALL push/PR refs, PART 5 C2:
# direct pushes to main/staging previously deployed untested)
# ============================================================
jobs:
  lint-and-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Get changed Python files
        id: changed
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d origin/main...HEAD -- '*.py' || echo "")
          if [ -z "$CHANGED" ]; then
            echo "files=app/ tests/ pipeline/" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting (Black)
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            echo "${{ steps.changed.outputs.files }}" | xargs black --check --diff
          else
            black --check --diff app/ tests/ pipeline/
          fi

      - name: Check import sorting (isort)
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            echo "${{ steps.changed.outputs.files }}" | xargs isort --check-only --diff
          else
            isort --check-only --diff app/ tests/ pipeline/
          fi

      - name: Static analysis (Flake8)
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            echo "${{ steps.changed.outputs.files }}" | xargs flake8
          else
            flake8 app/ tests/ pipeline/
          fi

      - name: Run tests
        env:
          GEMINI_API_KEY: test_key_placeholder
          GCHAT_WEBHOOK_URL: https://test-webhook.com
          GCP_PROJECT_ID: test-project
          REDIRECT_LOG_SHEET_ID: test_sheet_id_placeholder
        # Coverage floor at the measured current level; ratchet upward
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --cov-fail-under=35

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  # ============================================================
  # JOB 1b: Golden-QA eval gate (all push/PR refs)
  # Runs the smoke subset through the real graph and blocks the
  # merge when canonical-fact accuracy or judged aggregates regress
  # vs the matching accepted baseline. On the home repo a missing
  # GEMINI_API_KEY FAILS the gate (a rotated secret must never
  # silently disable quality checks); forks skip.
  # ============================================================
  eval-gate:
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Fail on missing secret (home repo only)
        if: env.GEMINI_API_KEY == '' && github.repository == 'bolablg/iBola-ChatBot'
        run: |
          echo "::error::GEMINI_API_KEY secret missing on the home repo; the eval gate must not silently skip."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: env.GEMINI_API_KEY != ''
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: env.GEMINI_API_KEY != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run golden-QA smoke eval
        if: env.GEMINI_API_KEY != ''
        env:
          GCHAT_WEBHOOK_URL: https://test-webhook.com
          GCP_PROJECT_ID: test-project
          REDIRECT_LOG_SHEET_ID: test_sheet_id_placeholder
        run: python scripts/run_eval.py --tags smoke --concurrency 4

      - name: Gate against accepted baseline
        if: env.GEMINI_API_KEY != ''
        run: |
          REPORT=$(ls -t local/eval_reports/*.json | head -1)
          python scripts/eval_gate.py --report "$REPORT" --strict

      - name: Upload eval report
        if: always() && env.GEMINI_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-report-${{ github.run_id }}
          path: local/eval_reports/
          retention-days: 30

      - name: Skipped (no GEMINI_API_KEY secret)
        if: env.GEMINI_API_KEY == ''
        run: echo "GEMINI_API_KEY secret not available; eval gate skipped."

  # ============================================================
  # JOB 1c: Nightly full golden-set eval (PART 5 C4)
  # ============================================================
  nightly-eval:
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full golden-set eval
        env:
          GCHAT_WEBHOOK_URL: https://test-webhook.com
          GCP_PROJECT_ID: test-project
          REDIRECT_LOG_SHEET_ID: test_sheet_id_placeholder
        run: python scripts/run_eval.py --concurrency 4

      - name: Gate against accepted baseline
        run: |
          REPORT=$(ls -t local/eval_reports/*.json | head -1)
          python scripts/eval_gate.py --report "$REPORT" --strict

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report-${{ github.run_id }}
          path: local/eval_reports/
          retention-days: 90

      - name: Alert on failure
        if: failure()
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: |
          if [ -n "$GCHAT_WEBHOOK_URL" ]; then
            curl -s -X POST -H 'Content-Type: application/json' \
              -d '{"text": "Nightly full golden-set eval FAILED for ibola-chatbot. Check the workflow run and report artifact."}' \
              "$GCHAT_WEBHOOK_URL"
          fi

  # ============================================================
  # JOB 2: Auto-merge to staging (if tests pass)
  # ============================================================
  merge-to-staging:
    needs: [lint-and-test, eval-gate]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT preferred (its pushes trigger downstream workflows); built-in
          # token as fallback so an expired PAT degrades instead of failing.
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure staging branch exists
        run: |
          git fetch origin
          if ! git rev-parse --verify origin/staging >/dev/null 2>&1; then
            git checkout -b staging origin/main
            git push origin staging
          fi

      - name: Check for commits ahead of staging
        id: check-diff
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch origin staging
          AHEAD=$(git rev-list --count origin/staging..origin/"$BRANCH_NAME" 2>/dev/null || echo "0")
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Commits ahead of staging: $AHEAD"

      - name: Create and auto-merge PR to staging
        if: steps.check-diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          EXISTING_PR=$(gh pr list --base staging --head "$BRANCH_NAME" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base staging \
              --head "$BRANCH_NAME" \
              --title "Auto-merge: ${BRANCH_NAME} → staging" \
              --body "Lint, format, and tests passed for branch \`${BRANCH_NAME}\` at commit \`${COMMIT_SHA}\`. Auto-merging to staging for security review."
          else
            echo "PR #${EXISTING_PR} already exists for ${BRANCH_NAME} → staging"
          fi
          PR_NUMBER=$(gh pr list --base staging --head "$BRANCH_NAME" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            for i in 1 2 3; do
              gh pr merge "$PR_NUMBER" --merge --delete-branch=false && break
              echo "Merge attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi

  # ============================================================
  # JOB 3: Security scan on staging
  # ============================================================
  security-scan:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit bandit safety

      # BLOCKING (PART 5 C6): new findings fail the pipeline; reviewed
      # exceptions live in .security-allowlist with review dates.
      - name: Dependency vulnerability scan (pip-audit, blocking)
        run: |
          IGNORES=$(grep -vE '^\s*#|^\s*$' .security-allowlist | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          pip-audit --strict --desc $IGNORES 2>&1 | tee pip-audit-report.txt

      - name: Dependency vulnerability scan (safety, informational)
        run: safety check --output text 2>&1 | tee safety-report.txt || true

      - name: Static security analysis (Bandit, blocking)
        run: bandit -r app/ pipeline/ -f txt -o bandit-report.txt --severity-level medium

      - name: Filesystem vulnerability scan (Trivy, blocking on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          exit-code: 1
          trivyignores: .security-allowlist

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.txt
            safety-report.txt
            bandit-report.txt
          retention-days: 30

  # ============================================================
  # JOB 4: Auto-create PR to main from staging
  # ============================================================
  create-prod-pr:
    needs: security-scan
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR to main
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          EXISTING_PR=$(gh pr list --base main --head staging --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING_PR" ]; then
            RELEASE_DATE=$(date +%Y-%m-%d)
            gh pr create \
              --base main \
              --head staging \
              --title "Release v${VERSION} (${RELEASE_DATE})" \
              --body "## Release v${VERSION}

          Security scans passed on staging. Ready for production deployment.

          ### Checks completed
          - [x] Lint & format (Black, isort, Flake8)
          - [x] Unit & integration tests
          - [x] Dependency vulnerability scan (pip-audit, safety)
          - [x] Static security analysis (Bandit)
          - [x] Filesystem vulnerability scan (Trivy)

          Merging this PR triggers production deployment to Cloud Run."
          else
            echo "PR already exists: staging → main (#${EXISTING_PR})"
          fi

  # ============================================================
  # JOB 4b: Weekly production smoke (scheduled)
  # Golden-QA smoke subset against the live service. Catches stale
  # profile facts reaching users between deploys.
  # ============================================================
  weekly-prod-smoke:
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke eval against production
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          PROD_URL=$(gcloud run services describe ibola-chatbot \
            --region us-central1 --format 'value(status.url)')
          echo "Warming production..."
          for i in 1 2 3; do
            curl -s -o /dev/null -m 90 "$PROD_URL/health" || true
            curl -s -o /dev/null -m 90 -X POST "$PROD_URL/ask-agentic" \
              -H 'Content-Type: application/json' \
              -d '{"user_input":"What is Bolaji latest role?","session_id":"weekly-warmup","user_language":"en"}' || true
          done
          python scripts/run_eval.py --tags smoke --base-url "$PROD_URL" --concurrency 4
          REPORT=$(ls -t local/eval_reports/*.json | head -1)
          python scripts/eval_gate.py --report "$REPORT" --strict

      - name: Upload production smoke eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-eval-${{ github.run_id }}
          path: local/eval_reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Alert on failure
        if: failure()
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: |
          if [ -n "$GCHAT_WEBHOOK_URL" ]; then
            curl -s -X POST -H 'Content-Type: application/json' \
              -d '{"text": "Weekly production smoke eval FAILED for ibola-chatbot. Check the workflow run."}' \
              "$GCHAT_WEBHOOK_URL"
          fi

  # ============================================================
  # JOB 5: Deploy to production (main branch)
  # Own NON-canceling concurrency group (PART 5 C5): the top-level
  # group cancels in-progress runs, which could kill a deploy
  # mid-canary/promote on a rapid second push.
  # ============================================================
  deploy:
    needs: [lint-and-test, eval-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Build and push Docker image
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: gcloud builds submit --tag "gcr.io/${GCP_PROJECT}/ibola-chatbot"

      - name: Deploy canary revision (no traffic)
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          DATA_PATH: ${{ secrets.DATA_PATH }}
          DB_PATH: ${{ secrets.DB_PATH }}
          REDIRECT_LOG_SHEET_ID: ${{ secrets.REDIRECT_LOG_SHEET_ID }}
        run: |
          # Langfuse is wired entirely from Secret Manager (like the Gemini /
          # GChat secrets): no keys as plain env vars. Only enabled when all
          # three SM secrets exist, so forks / unprovisioned envs still deploy
          # with tracing inert.
          LANGFUSE_ARGS=""
          if gcloud secrets describe ibola-langfuse-secret-key >/dev/null 2>&1 \
             && gcloud secrets describe ibola-langfuse-public-key >/dev/null 2>&1 \
             && gcloud secrets describe ibola-langfuse-base-url >/dev/null 2>&1; then
            LANGFUSE_ARGS="--set-secrets=LANGFUSE_SECRET_KEY=ibola-langfuse-secret-key:latest \
              --set-secrets=LANGFUSE_PUBLIC_KEY=ibola-langfuse-public-key:latest \
              --set-secrets=LANGFUSE_BASE_URL=ibola-langfuse-base-url:latest \
              --set-env-vars LANGFUSE_ENABLED=true"
          fi
          gcloud run deploy ibola-chatbot \
            --image "gcr.io/${GCP_PROJECT}/ibola-chatbot" \
            --platform managed \
            --region us-central1 \
            --memory 2Gi \
            --min-instances 0 \
            --allow-unauthenticated \
            --no-traffic \
            --tag canary \
            --set-secrets="GEMINI_API_KEY=ibola-gemini-api-key:latest" \
            --set-secrets="GCHAT_WEBHOOK_URL=ibola-gchat-webhook-url:latest" \
            --set-secrets="/secrets/gcp-sa-key.json=ibola-gcp-sa-key:latest" \
            --set-env-vars "GCP_SA_CREDENTIALS_PATH=/secrets/gcp-sa-key.json" \
            --set-env-vars "GCP_PROJECT=${GCP_PROJECT}" \
            --set-env-vars "GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID}" \
            --set-env-vars "DATA_PATH=${DATA_PATH}" \
            --set-env-vars "DB_PATH=${DB_PATH}" \
            --set-env-vars "REDIRECT_LOG_SHEET_ID=${REDIRECT_LOG_SHEET_ID}" \
            $LANGFUSE_ARGS

      - name: Smoke-eval the canary before cutover
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CANARY_URL=$(gcloud run services describe ibola-chatbot \
            --region us-central1 --format json \
            | jq -r '.status.traffic[] | select(.tag == "canary") | .url' | head -1)
          if [ -z "$CANARY_URL" ]; then
            echo "Could not resolve canary URL"; exit 1
          fi
          echo "Canary URL: $CANARY_URL"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Warm the canary first: min-instances=0 means the first request
          # cold-starts (model + index load, ~35s) and would blow the latency
          # gate on an otherwise-healthy revision. Warm, wait, then measure.
          echo "Warming canary..."
          for i in 1 2 3; do
            curl -s -o /dev/null -m 90 "$CANARY_URL/health" || true
            curl -s -o /dev/null -m 90 -X POST "$CANARY_URL/ask-agentic" \
              -H 'Content-Type: application/json' \
              -d '{"user_input":"What is Bolaji latest role?","session_id":"warmup","user_language":"en"}' || true
          done
          python scripts/run_eval.py --tags smoke --base-url "$CANARY_URL" --concurrency 4
          REPORT=$(ls -t local/eval_reports/*.json | head -1)
          python scripts/eval_gate.py --report "$REPORT" --strict

      - name: Upload canary eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-eval-report
          path: local/eval_reports/
          retention-days: 30

      - name: Promote canary to full traffic
        run: |
          gcloud run services update-traffic ibola-chatbot \
            --region us-central1 \
            --to-latest

      - name: Clean up canary tag and alert on failure
        if: failure()
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: |
          gcloud run services update-traffic ibola-chatbot \
            --region us-central1 --remove-tags canary || true
          if [ -n "$GCHAT_WEBHOOK_URL" ]; then
            curl -s -X POST -H 'Content-Type: application/json' \
              -d '{"text": "DEPLOY FAILED for ibola-chatbot: canary smoke or promotion failed. Traffic stays on the previous revision; canary tag removed. Check the workflow run."}' \
              "$GCHAT_WEBHOOK_URL"
          fi

      - name: Create GitHub Release with notes
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="v${VERSION}"

          # Skip if this version was already released
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi

          # Create the git tag if it doesn't exist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          # Find previous tag for changelog range
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || echo "")

          # Build release notes
          NOTES="## What's Changed"$'\n\n'
          if [ -n "$PREV_TAG" ]; then
            # List commit subjects since previous tag
            COMMITS=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s" --no-merges 2>/dev/null || echo "")
            if [ -n "$COMMITS" ]; then
              NOTES="${NOTES}${COMMITS}"$'\n\n'
            fi
            NOTES="${NOTES}**Full Changelog**: \`${PREV_TAG}...${TAG}\`"
          else
            NOTES="${NOTES}Initial release."
          fi

          # Create the GitHub Release
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "$NOTES" \
            --latest
