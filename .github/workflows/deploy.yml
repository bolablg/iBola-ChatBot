name: CI/CD Pipeline — Lint → Test → Stage → Security → Deploy

# ============================================================
# Flow:
#   Feature branch (push) → lint + format + test → auto-merge to staging
#   Staging (on push)      → security scan → auto-create PR to main
#   Main (on push / PR)    → deploy to Cloud Run (production)
# ============================================================

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# JOB 1: Lint + Format + Test (feature branches)
# ============================================================
jobs:
  lint-and-test:
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Get changed Python files
        id: changed
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d origin/main...HEAD -- '*.py' || echo "")
          if [ -z "$CHANGED" ]; then
            echo "files=app/ tests/ pipeline/" >> "$GITHUB_OUTPUT"
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Check formatting (Black)
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            echo "${{ steps.changed.outputs.files }}" | xargs black --check --diff
          else
            black --check --diff app/ tests/ pipeline/
          fi

      - name: Check import sorting (isort)
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            echo "${{ steps.changed.outputs.files }}" | xargs isort --check-only --diff
          else
            isort --check-only --diff app/ tests/ pipeline/
          fi

      - name: Static analysis (Flake8)
        run: |
          if [ "${{ steps.changed.outputs.mode }}" = "changed" ]; then
            echo "${{ steps.changed.outputs.files }}" | xargs flake8
          else
            flake8 app/ tests/ pipeline/
          fi

      - name: Run tests
        env:
          GEMINI_API_KEY: test_key_placeholder
          GCHAT_WEBHOOK_URL: https://test-webhook.com
          GCP_PROJECT_ID: test-project
          REDIRECT_LOG_SHEET_ID: test_sheet_id_placeholder
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests

  # ============================================================
  # JOB 2: Auto-merge to staging (if tests pass)
  # ============================================================
  merge-to-staging:
    needs: lint-and-test
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure staging branch exists
        run: |
          git fetch origin
          if ! git rev-parse --verify origin/staging >/dev/null 2>&1; then
            git checkout -b staging origin/main
            git push origin staging
          fi

      - name: Create and auto-merge PR to staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          EXISTING_PR=$(gh pr list --base staging --head "$BRANCH_NAME" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base staging \
              --head "$BRANCH_NAME" \
              --title "Auto-merge: ${BRANCH_NAME} → staging" \
              --body "Lint, format, and tests passed for branch \`${BRANCH_NAME}\` at commit \`${COMMIT_SHA}\`. Auto-merging to staging for security review."
          fi
          PR_NUMBER=$(gh pr list --base staging --head "$BRANCH_NAME" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --merge --auto --delete-branch=false
          fi

  # ============================================================
  # JOB 3: Security scan on staging
  # ============================================================
  security-scan:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pip-audit bandit safety

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --strict --desc 2>&1 | tee pip-audit-report.txt || true

      - name: Dependency vulnerability scan (safety)
        run: safety check --output text 2>&1 | tee safety-report.txt || true

      - name: Static security analysis (Bandit)
        run: bandit -r app/ pipeline/ -f txt -o bandit-report.txt --severity-level medium || true

      - name: Docker image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.txt
            safety-report.txt
            bandit-report.txt
          retention-days: 30

  # ============================================================
  # JOB 4: Auto-create PR to main from staging
  # ============================================================
  create-prod-pr:
    needs: security-scan
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          EXISTING_PR=$(gh pr list --base main --head staging --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$EXISTING_PR" ]; then
            RELEASE_DATE=$(date +%Y-%m-%d)
            gh pr create \
              --base main \
              --head staging \
              --title "Release v${VERSION} (${RELEASE_DATE})" \
              --body "## Release v${VERSION}

          Security scans passed on staging. Ready for production deployment.

          ### Checks completed
          - [x] Lint & format (Black, isort, Flake8)
          - [x] Unit & integration tests
          - [x] Dependency vulnerability scan (pip-audit, safety)
          - [x] Static security analysis (Bandit)
          - [x] Filesystem vulnerability scan (Trivy)

          Merging this PR triggers production deployment to Cloud Run."
          else
            echo "PR already exists: staging → main (#${EXISTING_PR})"
          fi

  # ============================================================
  # JOB 5: Deploy to production (main branch)
  # ============================================================
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create credential files
        env:
          GOOGLE_OAUTH_KEY: ${{ secrets.GOOGLE_OAUTH_KEY }}
          GOOGLE_OAUTH_KEY_PATH: ${{ secrets.GOOGLE_OAUTH_KEY_PATH }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_SA_KEY_PATH: ${{ secrets.GCP_SA_KEY_PATH }}
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
          GOOGLE_OAUTH_TOKEN_PATH: ${{ secrets.GOOGLE_OAUTH_TOKEN_PATH }}
        run: |
          echo "$GOOGLE_OAUTH_KEY" > "$GOOGLE_OAUTH_KEY_PATH"
          echo "GOOGLE_OAUTH_CREDENTIALS_PATH=$GOOGLE_OAUTH_KEY_PATH" >> "$GITHUB_ENV"
          echo "$GCP_SA_KEY" > "$GCP_SA_KEY_PATH"
          echo "GCP_SA_CREDENTIALS_PATH=$GCP_SA_KEY_PATH" >> "$GITHUB_ENV"
          echo "$GOOGLE_OAUTH_TOKEN" > "$GOOGLE_OAUTH_TOKEN_PATH"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Build and push Docker image
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: gcloud builds submit --tag "gcr.io/${GCP_PROJECT}/ibola-chatbot"

      - name: Deploy to Cloud Run
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          DATA_PATH: ${{ secrets.DATA_PATH }}
          DB_PATH: ${{ secrets.DB_PATH }}
          REDIRECT_LOG_SHEET_ID: ${{ secrets.REDIRECT_LOG_SHEET_ID }}
        run: |
          gcloud run deploy ibola-chatbot \
            --image "gcr.io/${GCP_PROJECT}/ibola-chatbot" \
            --platform managed \
            --region us-central1 \
            --memory 1Gi \
            --allow-unauthenticated \
            --set-env-vars "GOOGLE_OAUTH_CREDENTIALS_PATH=${GOOGLE_OAUTH_CREDENTIALS_PATH}" \
            --set-env-vars "GEMINI_API_KEY=${GEMINI_API_KEY}" \
            --set-env-vars "GCP_PROJECT=${GCP_PROJECT}" \
            --set-env-vars "GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID}" \
            --set-env-vars "GCHAT_WEBHOOK_URL=${GCHAT_WEBHOOK_URL}" \
            --set-env-vars "DATA_PATH=${DATA_PATH}" \
            --set-env-vars "DB_PATH=${DB_PATH}" \
            --set-env-vars "REDIRECT_LOG_SHEET_ID=${REDIRECT_LOG_SHEET_ID}" \
            --set-env-vars "GCP_SA_CREDENTIALS_PATH=${GCP_SA_CREDENTIALS_PATH}"

      - name: Map custom domain
        run: |
          gcloud components install beta --quiet
          gcloud beta run domain-mappings create --quiet \
            --service=ibola-chatbot \
            --domain=chat.bolablg.com \
            --region=us-central1

      - name: Tag release from VERSION file
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
            echo "Tagged release: v${VERSION}"
          else
            echo "Tag v${VERSION} already exists — skipping"
          fi
