name: Test and Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (add your test command here)
        run: |
          # Replace this with your actual test command
          echo "No tests found"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create credentials file
        run: |
          echo "${{ secrets.GCP_CREDENTIALS }}" > _conf/gcp-credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/_conf/gcp-credentials.json" >> $GITHUB_ENV
          echo "GOOGLE_API_CREDENTIALS_PATH=$(pwd)/_conf/gcp-credentials.json" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Create token.json
        run: |
          echo "${{ secrets.TOKEN_JSON }}" > _conf/token.json

      - name: Build and push Docker image
        run: |
          gcloud builds submit --tag gcr.io/${{ secrets.GCP_PROJECT }}/ibola-chatbot

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ibola-chatbot \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/ibola-chatbot \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}" \
            --set-env-vars "GOOGLE_CHAT_WEBHOOK_URL=${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}" \
            --set-env-vars "GOOGLE_API_CREDENTIALS_PATH=${{ env.GOOGLE_API_CREDENTIALS_PATH }}"

      - name: Map custom domain
        run: |
          gcloud run domains map bolablg.com --service ibola-chatbot --region us-central1

      - name: Clean up credentials file
        run: |
          rm _conf/gcp-credentials.json
