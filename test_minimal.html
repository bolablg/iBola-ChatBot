<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBola Minimal Test</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="title-section">
                <h1 class="ibola-title">
                    <span class="ibola-icon">🤖</span>
                    <span class="ibola-text">iBola</span>
                    <span class="ibola-subtitle">Minimal Test</span>
                </h1>
            </div>
            <div class="header-controls">
                <div class="mode-toggle" id="mode-toggle" title="Toggle theme">
                    <div class="toggle-container">
                        <span class="toggle-icon">🌙</span>
                        <span class="toggle-text">Dark</span>
                    </div>
                    <div class="toggle-slider">
                        <div class="toggle-handle"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-box" id="chat-box">
            <div class="typing-indicator" id="typing-indicator" style="display: none;">
                <span></span><span></span><span></span>
            </div>
        </div>

        <form class="chat-input-form" id="chat-form">
            <input type="text" id="user-input" placeholder="">
            <button type="submit">↑</button>
        </form>
    </div>

    <script src="/static/script_minimal.js"></script>
</body>
</html>
