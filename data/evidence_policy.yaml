request_scopes:
- id: requested_personal_production_scope
  description: The question requests personal production design or operation. An unqualified experience list inherits that setting. For every mentioned tool, provide direct actor/tool/setting proof, an explicitly labeled inventory or project-stack fact, or a locally scoped statement that personal production operation remains unverified. Project leadership does not establish operation of every service.
  query_pattern: '(?is)(?=.*\bproduction\b)(?=.*\b(?:personally|personal|personnellement|personnel\w*|operational ownership)\b)'
  subject_pattern: '(?i)\b(?:AWS EC2|AWS S3|EC2|S3|Pub/Sub|Dataflow|Apache NiFi|NiFi|Spark|Lakeflow)\b'
  record_limit_subjects: [Spark Structured Streaming, Apache Spark Structured Streaming]
  record_limit_modifiers: ['\bpersonal production experience\b', '\bproduction experience\b', '\bCDC event counts\b', '\bend-to-end latency\b', '\bavailability\b', '\bon-call responsibility for\b']
  subject_aliases:
    ec2: aws ec2
    s3: aws s3
    nifi: apache nifi
  personal_support_pattern: |-
    (?ix)\b(?:Bolaji|he|il)\s+(?:(?:has|had|a|personally|directly|personnellement|directement)\s+){0,3}
    (?:
      (?:uses?|used|operates?|operated|builds?|built|designs?|designed(?:\s+and\s+operated)?|deploys?|deployed|set\s+up|provisioned|configured|utilise|exploite|construit|concu|deploye)\s+(?:an?\s+)?
      (?P<tools_before>(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow)(?:\s*(?:,|and|et|with|avec)\s*(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow))*)
      (?:\s+(?:buckets?|pipelines?|systems?|applications?|components?)(?:\s+(?:of|for|within)\s+[^.;\n]{1,80}?)?)?\s+(?:in|en)\s+production
    |
      (?:has|had)\s+(?:personal\s+)?production\s+experience\s+with\s+
      (?P<tools_after>(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow)(?:\s*(?:,|and|et)\s*(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow))*)
    |
      (?:uses?|used|operates?|operated|builds?|built|designs?|designed|deploys?|deployed)\s+(?:a\s+|an\s+)?production\s+
      (?P<tools_front>(?:[\w/+-]+\s+){0,10}?(?:pipelines?|stacks?|systems?|services?|platforms?))
    )
  support_subject_groups: [tools_before, tools_after, tools_front]
  project_support_pattern: '(?is)Gozem Data Hub.{0,900}?(?:published case documents|documented stack (?:includes|contains))\s+(?P<tools>[^.\n]+)'
  project_tools_pattern: '(?im)^Tools:\s*(?P<tools>[^\n]+)'
  project_stack_sources: [90_website_canon_llms_full.txt, 13_gozem_internal_projects.txt, 10_apps_and_projects.txt]
  project_names:
    data_hub: '(?i)\b(?:Gozem\s+)?Data Hub\b'
    gozem: '(?i)\bGozem\b'
    rintio: '(?i)\bRintio\b'
    mongo_cdc: '(?i)\bMongoDB\s+CDC\b|\bCDC\s+pipeline\b'
  project_item_separator_pattern: '(?i)(?:,\s*(?:(?:and|et)\s+)?|\s+(?:and|et)\s+)(?:an?\s+)?(?=(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow)\b)'
  project_predicate_separator_pattern: '(?i)\s+and\s+(?=(?:(?:he|Bolaji)\s+)?personally\s+(?:designed|operated|used|deployed)\b)'
  shared_location_prefix_pattern: '(?i)^\s*(?:at|for|within|chez|dans)\s+[^,;.!?\n]{1,80},\s*'
  unknown_project_pattern: '(?i)(?:employer|project)[^.!?;\n]{0,85}(?:not\s+(?:specified|documented)|unknown)'
  unknown_project_record_limit_pattern: '(?i)^\s*(?:This\s+(?:clarification|confirmation)|The\s+(?:record|evidence))\s+does\s+not\s+(?:identify|specify|establish)\s+(?:(?:an?|any|the)\s+)?(?:employer|project)(?:\s+(?:and|or)\s+(?:employer|project))?\s+for\s+(?:(?:the|this|that|its)\s+)?{tool}(?:\s+(?:bucket|service))?\s*$'
  unknown_project_qualification_pattern: '(?ix)(?:^|[,:(])\s*(?:(?:the|its|exact|specific|precise)\s+){0,2}(?:employer|project)(?:\s*(?:and|or|/)\s*(?:employer|project))?(?:\s+(?:for|of)\s+(?:(?:this|that|the|its)\s+(?:bucket|service)|(?:AWS\s+)?(?:S3|EC2|Pub/Sub|Dataflow|Spark|NiFi|Lakeflow)))?\s+(?:(?:is|are|remains?)\s+)?(?:not\s+(?:(?:currently|explicitly|yet)\s+)?(?:specified|documented|identified)|unknown|unspecified|undocumented)\s*$'
  unknown_project_qualification_exclude_pattern: '(?i)\b(?:if|unless|whether|assuming|suppose|hypothetical|could|would|might)\b|\bnot\s+(?:unknown|unspecified|undocumented)\b'
  project_key: data_hub
  project_reference_pattern: '(?i)^(?:its\b|this (?:project|platform)\b|the (?:documented|published) stack\b)'
  project_anchor_pattern: '(?i)\b(?:Gozem\s+)?Data Hub\b'
  project_answer_pattern: '(?i)(?:documented|published).{0,30}(?:stack|case|part of)|architected and led|stack.{0,15}(?:includes|documents|contains)|Data Hub.{0,70}(?:used|uses|utilized|utilised|utilise)'
  implementation_support_pattern: '(?i)(?:built|implemented|construit|implemente).{0,70}(?:MongoDB|CDC).{0,180}(?:Pub/Sub|Dataflow)'
  qualification_pattern: '(?is)(?=.*(?:personal\w*|personnel\w*))(?=.*production)'
  personal_assertion_pattern: '(?i)\b(?:he|Bolaji|il)\s+(?:personally\s+|directly\s+)?(?:used|uses|operated|operates|designed|deployed)\b[^.;\n]{0,110}\b(?:and|then|et)\s+(?:used|uses|operated|operates|designed|deployed)\s+(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|NiFi|Lakeflow)\b|\b(?:personally|personnellement)\b.{0,90}\b(?:EC2|S3|Pub/Sub|Dataflow|Spark|NiFi|Lakeflow)\b|\b(?:he|Bolaji|il)\s+(?:(?:has|had|a|directly|personally)\s+){0,3}(?:operated|operates|operating|deployed|deploys|designed|designs|used|uses)\s+(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow)\b|\b(?:EC2|S3|Pub/Sub|Dataflow|Spark|NiFi|Lakeflow)\b.{0,30}(?:was|were|is)\s+personally\s+(?:operated|designed|used|deployed)|\bproduction\s+(?:experience|(?:Apache\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|NiFi|Lakeflow))\b'
  inventory_label_pattern: '(?i)^\s*(?:listed tools|tool inventory|inventory|documented tool list|outils listes)|\b(?:inventory|tool list|catalogue)\b.{0,30}(?:lists|includes|contains)|(?:appear\w*|listed)\s+in.{0,20}(?:inventory|tool list)'
  exclude_support_pattern: '(?i)\b(?:taught|teaches|teaching|supervised|delivered|designed)\b[^.;\n]{0,60}\b(?:training|bootcamp|module|lab|prototype|formation|atelier)\b|\b(?:for|during|in|en|pour)\s+(?:a\s+|an\s+)?(?:training|bootcamp|lab|prototype|formation|atelier)\b'
  operation_pattern: '(?i)\b(?:personally|operated|operating|operates|use|uses|used|using|designed|designing|designs|deployed|deploys|builds|built|exploite|utilise|concu)\b'

experience_confirmations:
- id: confirmed_non_use_requires_answer
  description: Explicit owner-confirmed absence must be stated when the requested tool is covered by that retrieved confirmation. Do not retain an outdated unknown or infer inability. Without an explicit confirmation, retain a documentation limit.
  source: 20_owner_confirmed_production_scope.txt
  negative_pattern: '(?i)Bolaji has no (?P<subject>[A-Za-z][A-Za-z /-]{0,45}?) experience at all'
  positive_pattern: '(?ix)\b(?:Bolaji|he|il)\b(?:(?!\b(?:another|colleague)\b)[^.;\n]){0,45}?\b(?P<operation_before>use[sd]?|worked\s+with|ran|managed|maintained|deployed|operated|designed|built|implemented|delivered|utilise|deploye|exploite|concu)\b(?:(?!\b(?:not|never|no|pas|jamais)\b)[^.;\n]){0,70}\b{subject}\b|\b(?:Bolaji|he|il)\s+(?P<experience_before>has|had|a)\s+(?:(?!\b(?:no|not|never|aucune?)\b)[^.;\n]){0,45}?\b(?:{subject}\s+experience|experience\s+(?:with|in|avec|en)\s+{subject})\b|(?=(?:his\s+{subject}\b|{subject}\b[^.;\n]{0,80}\bby\s+(?:Bolaji|him)\b))\b(?:his\s+)?{subject}\s+(?:(?:architecture|pipeline|system|delivery|implementation|production|experience)\s+){0,3}(?:was|is|has\s+been)\s+(?:(?:personally|directly|actually)\s+){0,2}(?P<operation_after>used|deployed|operated|designed|built|documented|confirmed|established)\b'
  positive_predicate_groups: [operation_before, experience_before, operation_after]
  positive_exclude_pattern: '(?i)\b(?:if|unless|would|could|hypothetical|fictional|requirement|vacancy)\b|\b(?:by|another)\s+(?:engineer|colleague|person|employee)\b'

editorial_constraints:
- id: superseded_growth_interval_echo
  description: Give the confirmed growth stages directly without echoing the superseded interval, even to deny it. State the remaining headcount documentation limit without repeating that interval.
  sources: [19_owner_confirmed_scope.txt]
  support_pattern: 'initial team grew to 4|L\x27équipe initiale a atteint 4'
  query_pattern: '(?i)(?:growth|croissance|developp).{0,180}(?:countries|pays)|(?:team|equipe).{0,100}\b(?:dates|limites|boundaries)\b'
  answer_pattern: '(?i)(?:de |from )(?:zero|0).{0,12}(?:14|quatorze)'

role_project_relations:
- &project_role_scope
  id: cdc_role_attribution_requires_direct_evidence
  description: Retain only role associations directly supported by the same project's actor and responsibility record. Dataflow use in the earlier cloud migration and a nearby role title do not date CDC delivery. A confirmed work-role interval locates the work within that role; it does not establish exact project start or completion dates, continuous operation throughout that interval, or dates for another service.
  project_pattern: '(?i)\bMongoDB\s+(?:CDC|change\s+data\s+capture)\b|\bCDC\s+pipeline\b'
  role_pattern: '(?i)Global Data Analyst|Head of Data|Data Director|Director of Data'
  role_aliases:
    director of data: data director
  role_prefix_pattern: '(?i)(?:as(?: a| the)?|during(?: his| the)?(?: earlier| former| previous)?|(?:when|while)\s+(?:he|Bolaji)\s+was|in\s+his(?:\s+(?:earlier|former|previous))?|en tant que|pendant(?: son| le)?(?: mandat de)?)\s+$'
  role_heading_pattern: '(?i)(?P<role>Global Data Analyst|Head of Data|Data Director|Director of Data)(?:\s+at Gozem|\s+role|\s*\([^)]*\))*'
  scope_reset_pattern: '(?i)^\s*(?:Separately|For a separate project|For another project|Distinctement|Named production implementation\s*\()'
  source_quote_reset_pattern: '(?i)^\s*Named production implementation\s*\('
  scope_limit_subject_pattern: '(?i)\b(?:role|period|date|mandate|poste|periode)\w*\b'
  evidence_limit_prefix_pattern: '(?i)(?:does not establish|not documented|not established|ne precise pas|unknown|unconfirmed|unverified)[^.!?;\n]{0,80}\b(?:that|whether|if|que|si)\b'
  evidence_limit_suffix_pattern: '(?i)^\s*whether\b[^.!?;\n]+\b(?:is|remains)\s+(?:unknown|unconfirmed|unverified|undocumented)\b'
  denied_project_prefix_pattern: '(?i)\b(?:never|did not|has not)\s+(?:(?:personally|directly)\s+)?(?:design(?:ed)?|operat(?:e|ed)|built|build|implement(?:ed)?)\s+(?:the\s+)?$'
  after_project_role_pattern: '(?i)\s*(?:pipeline\s+)?(?:at\s+Gozem\s+)?(?:as(?: a| the)?|during(?: his| the)?(?: role as)?)\s+'
  unrelated_project_prefix_pattern: '(?i)\b(?:independently of|separate from|unrelated to|not for)\s+(?:the\s+)?$'
  support_relation_pattern: '(?i)\b(?:Bolaji|he|il)\s+(?:(?:has|had|a|personally|directly|personnellement)\s+){0,3}(?:designed|operated|built|implemented|concu|exploite|construit|implemente)(?:\s+and\s+(?:designed|operated|built|implemented))?\s+(?:the\s+)?(?:MongoDB\s+(?:CDC|change\s+data\s+capture)(?:\s+pipeline)?|CDC\s+pipeline|(?:Google\s+Cloud\s+)?Pub/Sub\s+and\s+(?:Google\s+Cloud\s+)?Dataflow(?:\s+in\s+production)?\s+for\s+(?:the\s+)?MongoDB\s+(?:CDC|change\s+data\s+capture)(?:\s+pipeline)?)\b'
  support_exclude_pattern: '(?i)\b(?:if|hypothetical|fictional|would|could|never|not|unverified|unknown|undocumented)\b'
- <<: *project_role_scope
  id: ec2_role_attribution_requires_direct_evidence
  description: Confirmed personal EC2 design and operation for Gozem Data Hub does not establish its role or work period. A CDC role confirmation, nearby heading, another service, or another actor cannot date the EC2 responsibility. Require the same clause to link Bolaji, EC2 production responsibility, Data Hub, and the claimed role. Keep confirmed EC2 responsibility separately undated when its role is unknown.
  project_pattern: '(?i)\b(?:AWS\s+)?EC2\b'
  claim_sentence_scope: true
  after_project_role_pattern: '(?i)\s+(?:in\s+production\s+)?(?:for\s+(?:the\s+)?(?:Gozem\s+)?Data Hub\s+)?(?:as(?: a| the)?|during(?: his| the)?(?: role as)?)\s+'
  support_relation_pattern: '(?i)\b(?:Bolaji|he|il)\s+(?:(?:has|had|a|personally|directly|personnellement)\s+){0,3}(?:designed|operated|built|implemented|concu|exploite)(?:\s+and\s+(?:designed|operated|built|implemented))?\s+(?:AWS\s+)?EC2\s+in\s+production\b'
  support_anchor_pattern: '(?i)\b(?:Gozem\s+)?Data Hub\b'
  support_same_clause: true
  other_actor_pattern: '(?i)\b(?:colleague|another engineer|another person|another employee|son collegue)\b'
  conditional_prefix_pattern: '(?i)^\s*(?:if|unless|suppose|assuming|hypothetically)\b'

relationship_constraints:
- id: fraud_metrics_exclude_ml_attribution
  description: The approximately 150 incidents per month and over 25M XOF fraud discovery came from micro-batches, rules, and EDA. ML screening did not contribute to either result. Keep the separate 7x field-agent payment result in its own project scope.
  binding_mode: predicate_attribution
  subject_pattern: '(?i)\b(?:ML(?:[ -]based)?|machine[ -]learning|apprentissage automatique)\b(?:[ -]+fraud[ -]+screening)?'
  other_subject_pattern: '(?i)\bmicro[ -]?batch\w*|\brule[ -]based\b|\brules?\b|\bEDA\b|\bregles\b'
  clause_extra_predicates: '\b(?:reports?|reported|became|becomes|improved|achieved|delivered)\b'
  predicate_pattern: '(?i)\b(?:surfaces?|surfaced|flags?|flagged|detects?|detected|identif(?:y|ies|ied)|discover(?:s|ed)?|produc(?:e|es|ed)|contribut(?:e|es|ed)|yield(?:s|ed)?|caus(?:e|es|ed)|result(?:s|ed)? in|responsible for|credited with|attribu\w*|contribu\w*|detecte\w*|signale\w*|identifie\w*)\b'
  metric_pattern: '(?i)\b150\s+(?:incidents?|cases?|cas)\b|\b25\s*(?:M|million\w*)\s*(?:XOF|CFA|FCFA)\b'
  reference_pattern: '(?i)^\s*(?:(?:it|they|this|that|the|these|those)\s*(?:systems?|models?|pipelines?|screening|approaches?)?\b|(?:did|does|do|has|have|had|was|were|is|are)\b|(?:surface|flag|detect|identify|discover|produce|contribute|yield|cause)\w*\b)'
  subject_exclude_prefix_pattern: '(?i)(?:unlike|rather than|as opposed to|independent(?:ly)? from|separately from|no evidence (?:that|of))\s*$'
  clause_separator_pattern: '(?i)\b(?:while|whereas|tandis que|alors que)\b'
- id: cdc_migration_metrics_require_separate_scope
  description: The 10+ TB migration within a single quarter belongs to the earlier Global Data Analyst cloud infrastructure migration, not the MongoDB CDC pipeline. Keep CDC responsibility and migration measurements in separately attributed claims.
  binding_mode: local_cooccurrence
  qualifier_prefix_pattern: '(?i)\b(?:no evidence|no documentation|does not establish|not documented|unverified)\s+(?:that\s+|of\s+|for\s+)?(?:(?:the|a|an|MongoDB|CDC|pipeline|system|workload)\s+){0,7}$'
  subject_pattern: '(?i)MongoDB\s+CDC|\bCDC\s+(?:pipeline|system|workload)'
  metric_pattern: '(?i)\bmigrat\w*[^.!?;\n]{0,90}(?:(?:over\s+)?10\+?\s*TB|10\s*TB\s+plus|(?:a|one|single)\s+quarter)|\b(?:over\s+)?10\+?\s*TB[^.!?;\n]{0,50}(?:migrat|quarter)'
- id: initial_cloud_choice_not_finops_cause
  description: The initial cloud-first platform choice and migration belong to the earlier Global Data Analyst role. The later Head of Data FinOps cost reduction is a separate recorded initiative. Do not attribute that reduction to the initial choice or a nearby reference to that decision; retain both facts separately with their own role and initiative.
  cause_pattern: '(?i)cloud.first|initial.{0,30}(?:cloud|GCP|platform)|(?:cloud|GCP) migration'
  separate_pattern: '(?i)\b(?:separately|later|FinOps|Dataform|incremental|partitioning|clustering)\b'
  reference_pattern: '(?i)\b(?:this|that|the) (?:decision|choice|approach)|\bit\b'
  causal_pattern: '(?i)\b(?:resulted in|contributed to|led to|caused|reduced|cut|achieved|drove|yielded|yielding)\b'
  metric_pattern: '42[.,]57\s*%'
  negation_pattern: '(?i)\b(?:not|never|no|pas|non)\b'
