  query_pattern: '(?i)(?:growth|croissance|developp).{0,180}(?:countries|pays)|(?:team|equipe).{0,100}(?:dates|limites|boundaries)'
  answer_pattern: '(?i)(?:initial|premiere|d.abord|Global Data Analyst).{0,100}(?:to|a|jusqu.a|attein\w*)\s+(?:4|quatre)|(?:to|a|jusqu.a|attein\w*)\s+(?:4|quatre).{0,100}(?:initial|premiere|Global Data Analyst)'
