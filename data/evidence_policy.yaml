version: 31
source_types:
  21_production_service_inventory.txt: candidate_confirmed
  20_owner_confirmed_production_scope.txt: candidate_confirmed
  90_website_canon_llms_full.txt: published
  18_confirmed_clarifications.txt: candidate_confirmed
  15_professional_narrative.txt: interpretation
  17_highlights_pitch.txt: summary
  19_owner_confirmed_scope.txt: candidate_confirmed
assertion_rules:
- id: latency_threshold_wording_requires_source
  description: Do not claim that a source states a particular latency threshold unless retrieved source text actually discusses that threshold. A user-provided comparison benchmark is not a measured capability or source quotation; mark an unsupported comparison as unknown and verify the exact answer.
  answer_pattern: '(?i)\b(?P<threshold>sub[ -]?second)\b'
  affirmation_pattern: '(?i)\b(?:source|documentation|record|KB|knowledge base)\s+(?:(?:explicitly|specifically|clearly)\s+)?(?:notes?|states?|says?|mentions?|establishes?)\b[^.!?;\n]{0,120}\bsub[ -]?second\b'
  support_pattern: '(?i)\b(?P<threshold>sub[ -]?second)\b'
  binding_groups: [threshold]
  literal_mention: true
- id: onsite_availability_requires_same_actor_evidence
  description: Working hours and employment type do not establish physical location. Preserve remote, full-time and consulting as their own categories. Do not translate them into affirmative availability for on-site work, présentiel or en mode present without retrieved availability for the same actor and location arrangement.
  answer_pattern: '(?i)\b(?:available|open|willing|disponible|ouvert|prete?|pret)\w*[^.;\n]{0,120}(?:on.site|in.person|presentiel|en mode present)\b|\b(?:on.site|in.person|presentiel|en mode present)[^.;\n]{0,80}\b(?:available|disponible)\b'
  affirmation_pattern: '(?i)\b(?:Bolaji|he|il)\b'
  support_pattern: '(?i)\bBolaji\s+(?:(?:is|est|remains|reste)\s+)?(?:(?:currently|actuellement|now)\s+)?(?:available|open|willing|disponible|ouvert|pret)\w*\s+(?:(?:to|for|pour|a|des|du|un|une|en|full.time|part.time)\s+){0,8}(?:(?:work|roles?|positions?|missions?|travail|travailler|opportunities)\s+(?:en\s+)?(?:on.site|in.person|presentiel|en mode present)|(?:on.site|in.person|presentiel|en mode present)\s+(?:work|roles?|positions?|missions?|travail|opportunities))\b'
  uncertainty_prefix_pattern: '(?i)(?:(?:not (?:documented|established|confirmed)|does not (?:establish|document|confirm|specify))\s+(?:whether|if|that)\s+(?:he|Bolaji)\s+(?:is\s+)?(?:currently\s+)?|ne (?:precise|confirme|documente) pas s\x27il est\s+(?:actuellement\s+)?)$'
  exclude_support_pattern: '(?i)\b(?:training|teaching|bootcamp|historical|previously|former|previous role|past role|earlier role|requirement|vacancy|fictional|hypothetical|formations?|auparavant|ancien\w*|interviews?|meetings?|conferences?|entretiens?|reunions?)\b'
  support_continuation_pattern: '(?i)^\s*(?:(?:only|solely|exclusively|uniquement|seulement)\b|(?:this|that|it|availability|arrangement|ceci|cela|cette?)\b.{0,40}\b(?:only|solely|limited|restricted|confined|uniquement|seulement|limite|restreint|reserve)\w*\b|(?:for|pour)\s+[^.;\n]{1,35}\b(?:only|uniquement|seulement)\b)'
  clause_support: true
  local_negation: true
  local_uncertainty: true
- id: operating_model_requires_retrieved_support
  description: An operating-model design claim requires retrieved evidence of that responsibility. General team leadership or platform strategy is insufficient. The documented operating model concerns the data function.
  answer_pattern: '(?i)(?:(?:design\w*|creat\w*|built|build\w*|develop\w*|defin\w*|establish\w*)[^.!?;\n]{0,80}operating models?|operating models?[^.!?;\n]{0,60}(?:design\w*|creat\w*|built|build\w*|develop\w*|defin\w*|establish\w*))'
  affirmation_pattern: '(?i)\b(?:Bolaji|he|his|il|son|ses)\b'
  support_pattern: 'designed the operating model for the data function across Analytics, Data Engineering, and Data Science'
- id: streaming_operation_requires_operation_evidence
  description: Personal production design of a streaming implementation does not establish personal production operation of its services. Retain the documented design responsibility and mark operation unconfirmed unless the same tool has direct operation evidence.
  answer_pattern: '(?i)\b(?:operated|operates|operating|ran|maintained|exploite\w*)\s+[^.;\n]{0,85}\b(?:Pub/Sub|Dataflow)\b'
  support_pattern: '(?i)\b(?:Bolaji|he|il)\s+(?:(?:has|had|a|personally|directly|personnellement)\s+){0,3}(?:operated|operates|ran|maintained|exploite\w*|designed and operated)\s+(?P<tools>(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow)(?:\s*(?:,|and|et|with)\s*(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow))*)(?:\s+(?:components?|pipelines?|systems?))?\s+(?:in|en)\s+production'
  subject_pattern: '(?i)\b(?:Pub/Sub|Dataflow)\b'
  support_subject_groups: [tools]
  clause_support: true
  local_negation: true
- id: manager_layers_require_direct_evidence
  answer_pattern: (?i)(?:manager.of.managers|management of managers)|(?i:management de managers|manager de
    managers)
  support_pattern: (?i)(?:directly managed|supervised|led)\s+(?:\w+\s+){0,3}(?:managers|team leads)\b
- id: quantified_manager_layers_require_direct_evidence
  description: Vacancy staffing requirements do not establish Bolaji's manager layers. An assertion about managers within his organization needs direct retrieved support for the same count and relationship. Manager users or stakeholders are a separate population.
  answer_pattern: '(?i)(?:(?:team|organization|organisation|equipe|staff)[^.!?;\n]{0,120}?(?:including|included|includes|compris|dont|avec)|(?:Bolaji|he|il)\s+(?:directly\s+)?(?:managed|supervised|led|encadrait|dirigeait))\s+(?P<count>\d+|one|two|three|un|deux|trois)\s+(?:managers|team leads|responsables)\b'
  support_pattern: '(?i)(?:(?:Bolaji|he|il)\s+(?:directly\s+)?(?:managed|supervised|led|encadrait|dirigeait)|(?:his|Bolaji.s)\s+(?:team|organization|organisation|equipe)[^.!?;\n]{0,80}(?:included|includes|comprised|comprenait))\s+(?P<count>\d+|one|two|three|un|deux|trois)\s+(?:managers|team leads|responsables)\b'
  exclude_support_pattern: '(?i)training|users|utilisateurs|adoption|stakeholders|vacancy|requires|fictional|hypothetical'
  binding_groups: [count]
  clause_support: true
  local_negation: true
- id: formal_performance_authority_requires_direct_evidence
  description: HR partnership, hiring, onboarding and performance-management participation do not establish formal authority. An affirmative personal authority claim requires direct same-actor authority evidence in a supporting clause.
  answer_pattern: '(?i)\b(?:formal\s+)?performance[ -]management\s+(?:authority|accountability|approval rights)\b'
  affirmation_pattern: '(?i)\b(?:Bolaji|he|his)\b[^.;\n]{0,100}\b(?:has|had|holds?|held|possess(?:es|ed)?|exercised|was granted|includes?|included|encompasses|entailed|is documented|is confirmed)\b|\b(?:authority|accountability|approval rights)\b[^.;\n]{0,40}\b(?:is|was)\s+(?:held|documented|confirmed|established)\b'
  support_pattern: '(?i)\bBolaji\s+(?:(?:personally|directly)\s+)?(?:has|had|holds?|held|possess(?:es|ed)?|exercised|was granted)\s+(?:(?:formal|direct|sole|final)\s+){0,2}performance[ -]management\s+(?:authority|accountability|approval rights)\b'
  exclude_support_pattern: '(?i)\b(?:Source|Title|Section|Parent context)\s*:|\b(?:if|unless|hypothetical|suppose|assuming|would|could|might|colleague|vacancy|requires)\b'
  exclude_support_line_pattern: '(?i)^\s*(?:Source|Title|Section|Parent context)\s*:'
  negation_pattern: '(?i)^\s*(?:if|unless|suppose|assuming|ask whether)\b'
  clause_support: true
  local_negation: true
- id: budget_authority_requires_direct_evidence
  answer_pattern: (?i)(?:budget (?:authority|ownership|approval)|(?:department|operating|multi.year) budget|approval
    authority)|(?i:(?:autorite|responsabilite|approbation) (?:du |de )?budget|budget (?:departemental|pluriannuel|de
    fonctionnement))
  support_pattern: (?i)(?:owned|approved|held|was accountable for)\s+(?:\w+\s+){0,4}(?:department budget|operating
    budget|budget approval authority)
  affirmation_pattern: (?i)(?:(?:has|had|holds?|held|owns?|owned|approved|manages?|managed|demonstrates?|demonstrated|shows?|proves?|evidences?|establishes?|confirms?|includes?|included|detient|detenait|possede|approuvait|assume|gerait|evidence
    of|(?:is|was) accountable for|(?:est|etait) responsable (?:du|de))\b.{0,90}(?:budget (?:authority|ownership|approval)|(?:department|operating|multi.year)
    budget|approval authority|(?:autorite|responsabilite|approbation) (?:du |de )?budget|budget (?:departemental|pluriannuel|de
    fonctionnement))|(?:budget (?:authority|ownership|approval)|(?:department|operating|multi.year) budget|approval
    authority|(?:autorite|responsabilite|approbation) (?:du |de )?budget|budget (?:departemental|pluriannuel|de
    fonctionnement)).{0,50}\b(?:is|was|has been)\s+(?:confirmed|documented|established|demonstrated|held|owned)|(?:budget
    (?:authority|ownership|approval)|(?:department|operating|multi.year) budget|approval authority|(?:autorite|responsabilite|approbation)
    (?:du |de )?budget|budget (?:departemental|pluriannuel|de fonctionnement))\s*:\s*(?:yes|confirmed))
- id: non_use_requires_explicit_negative_evidence
  resolve_confirmed_non_use_reference: true
  answer_pattern: (?i)(?:has (?:not|never) (?:directly )?(?:used|worked with)|never used|no (?:(?:personal|direct) )?production
    experience (?:with|in))\s+[^.;,]+|(?i:(?:n'a (?:jamais|pas) (?:directement )?utilise|aucune experience
    (?:directe )?en production (?:avec|sur))\s+[^.;,]+)
  support_pattern: (?i)(?:has (?:not|never) (?:directly )?(?:used|worked with)|never used|no (?:(?:personal|direct) )?production
    experience (?:with|in))\s+[^.;,]+|(?i:(?:n'a (?:jamais|pas) (?:directement )?utilise|aucune experience
    (?:directe )?en production (?:avec|sur))\s+[^.;,]+)
  match_subject: true
- id: lab_tool_requires_own_production_evidence
  answer_pattern: (?i)(?:production.{0,100}\b(?:Lakeflow|Databricks|Delta Lake|Unity Catalog)\b|\b(?:Lakeflow|Databricks|Delta
    Lake|Unity Catalog)\b.{0,70}in production)
  support_pattern: (?i)(?:personally (?:used|deployed|operated).{0,35}\b(?:Lakeflow|Databricks|Delta Lake|Unity
    Catalog)\b.{0,20}in production)
  subject_pattern: (?i)\b(?:Lakeflow|Databricks|Delta Lake|Unity Catalog)\b
- id: growth_baseline_requires_explicit_endpoints
  description: A first hire or growth to a size does not establish a zero starting size. Retain the documented growth endpoints and their own role period; remove the inferred baseline.
  answer_pattern: '(?i)(?:team|organization|organisation|equipe|effectif)[^.;\n]{0,100}(?:from|de)\s+(?:zero|0)\s+(?:to|a)\s+(?:plus de\s+)?(?P<endpoint>\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|quatre|quatorze)'
  support_pattern: '(?i)(?:team|organization|organisation|equipe|effectif)[^.;\n]{0,100}(?:from|de)\s+(?:zero|0)\s+(?:to|a)\s+(?:plus de\s+)?(?P<endpoint>\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|quatre|quatorze)'
  binding_groups: [endpoint]
  clause_support: true
  local_negation: true
- id: deficiency_requires_same_tool_evidence
  description: Missing documentation is a verification gap, not established absence of experience. Bind qualified absence to the actual tool and setting. Production-only absence does not establish total non-use, and an experience gap does not establish absolute absence.
  resolve_confirmed_non_use_reference: true
  answer_pattern: '(?i)\b(?:(?P<absence_before>(?:has\s+)?no)\s+(?:(?:personal|direct|production|professional|practical|hands[ -]on)\s+){0,3}(?P<tools_before>(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)(?:\s*(?:,|and|or|et|ou)\s*(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks))*)\s+(?:(?:personal|direct|production|professional|practical|hands[ -]on)\s+){0,3}experience|(?:(?P<absence_after>lack(?:s|ed| of)?|(?:has\s+)?no)\s+(?:(?:personal|direct|production|professional|practical|hands[ -]on)\s+){0,3}experience|experience gap|lacune d.experience|manque d.experience)(?:\s+(?:(?:with|in|of|for|using|en|avec|sur|de)\s+)?(?P<tools_after>(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)(?:\s*(?:,|and|or|et|ou)\s*(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks))*))?|(?P<absence_never>(?:has\s+)?never\s+(?:used|worked with))\s+(?P<tools_never>(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)(?:\s*(?:,|and|or|et|ou)\s*(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks))*))\b(?:\s+(?:in|en)\s+production)?'
  support_pattern: '(?i)\b(?:(?P<absence_before>(?:has\s+)?no)\s+(?:(?:personal|direct|production|professional|practical|hands[ -]on)\s+){0,3}(?P<tools_before>(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)(?:\s*(?:,|and|or|et|ou)\s*(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks))*)\s+(?:(?:personal|direct|production|professional|practical|hands[ -]on)\s+){0,3}experience|(?:(?P<absence_after>lack(?:s|ed| of)?|(?:has\s+)?no)\s+(?:(?:personal|direct|production|professional|practical|hands[ -]on)\s+){0,3}experience|experience gap|lacune d.experience|manque d.experience)\s+(?:(?:with|in|of|for|using|en|avec|sur|de)\s+)?(?P<tools_after>(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)(?:\s*(?:,|and|or|et|ou)\s*(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks))*)|(?P<absence_never>(?:has\s+)?never\s+(?:used|worked with))\s+(?P<tools_never>(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)(?:\s*(?:,|and|or|et|ou)\s*(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks))*))\b(?:\s+(?:in|en)\s+production)?'
  subject_pattern: '(?i)\b(?:Power BI|DAX|Tableau|dbt|Kafka|Spark Structured Streaming|Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)\b'
  qualifier_pattern: '(?i)\b(?:personal|direct|production|professional|practical|hands[ -]on)\b'
  exclude_support_pattern: '(?i)\b(?:if|unless|hypothetical|suppose|assuming|would|could|might|you|your)\b'
  answer_subject_groups: [tools_after, tools_before, tools_never]
  support_subject_groups: [tools_after, tools_before, tools_never]
  absolute_predicate_groups: [absence_after, absence_before, absence_never]
  subjects_from_query: true
  local_uncertainty: true
  clause_support: true
  local_negation: true
- id: proficiency_deficiency_requires_same_tool_evidence
  description: Absence of tool use does not establish lack of proficiency or inability. A proficiency or capability gap requires explicit deficiency evidence for that same tool and setting.
  answer_pattern: '(?i)\b(?:skills? gap|capability gap|lack(?:s|ed| of)?\s+(?:(?:personal|direct|production|professional|practical|hands[ -]on)\s+){0,3}proficiency|lacune de competences?|manque de competences?)(?:\s+(?:(?:with|in|of|for|using|en|avec|sur|de)\s+)?(?P<tools_after>(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)(?:\s*(?:,|and|or|et|ou)\s*(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks))*))?\b(?:\s+(?:in|en)\s+production)?'
  support_pattern: '(?i)\b(?:skills? gap|capability gap|lack(?:s|ed| of)?\s+(?:(?:personal|direct|production|professional|practical|hands[ -]on)\s+){0,3}proficiency|lacune de competences?|manque de competences?)\s+(?:(?:with|in|of|for|using|en|avec|sur|de)\s+)?(?P<tools_after>(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)(?:\s*(?:,|and|or|et|ou)\s*(?:Power BI|DAX|Tableau|dbt|Kafka|(?:Apache\s+)?Spark Structured Streaming|(?:Apache\s+)?Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks))*)\b(?:\s+(?:in|en)\s+production)?'
  subject_pattern: '(?i)\b(?:Power BI|DAX|Tableau|dbt|Kafka|Spark Structured Streaming|Spark|Snowflake|Redshift|Dagster|Pub/Sub|Dataflow|Lakeflow|Databricks)\b'
  qualifier_pattern: '(?i)\b(?:personal|direct|production|professional|practical|hands[ -]on)\b'
  exclude_support_pattern: '(?i)\b(?:if|unless|hypothetical|suppose|assuming|would|could|might|you|your)\b'
  answer_subject_groups: [tools_after]
  support_subject_groups: [tools_after]
  subjects_from_query: true
  local_uncertainty: true
  clause_support: true
  local_negation: true
- id: streaming_production_requires_scoped_evidence
  description: A tool inventory or teaching module does not establish personal production experience. Bind each tool to the named actor's operation and experience setting. Retain documented implementations at their stated scope, or label production ownership unverified.
  answer_pattern: '(?i)(?:\bproduction\b[^.;\n]*\b(?:Pub/Sub|Dataflow)\b[^.;\n]*|\b(?:Pub/Sub|Dataflow)\b[^.;\n]*\bproduction\b[^.;\n]*)'
  support_pattern: |-
    (?ix)\b(?:Bolaji|he|il)\s+(?:(?:has|had|a|personally|directly|personnellement|directement)\s+){0,3}
    (?:
      (?:uses?|used|operates?|operated|builds?|built|designs?|designed(?:\s+and\s+operated)?|deploys?|deployed|set\s+up|provisioned|configured|utilise|exploite|construit|concu|deploye)\s+(?:an?\s+)?
      (?P<tools_before>(?:Google\s+)?(?:Pub/Sub|Dataflow)(?:\s*(?:,|and|et|with|avec)\s*(?:Google\s+)?(?:Pub/Sub|Dataflow))*)
      (?:\s+(?:buckets?|pipelines?|systems?|applications?|components?)(?:\s+(?:of|for|within)\s+[^.;\n]{1,80}?)?)?\s+(?:in|en)\s+production
    |
      (?:has|had)\s+(?:personal\s+)?production\s+experience\s+with\s+
      (?P<tools_after>(?:Google\s+)?(?:Pub/Sub|Dataflow)(?:\s*(?:,|and|et)\s*(?:Google\s+)?(?:Pub/Sub|Dataflow))*)
    )
  subject_pattern: '(?i)\b(?:Pub/Sub|Dataflow)\b'
  support_subject_groups: [tools_before, tools_after]
  negation_pattern: '(?i)\b(?:not|no|pas|non)\s+(?:(?:a|in|personal|confirmed|documented|en)\s+){0,3}production\b'
  clause_support: true
  local_negation: true
  exclude_support_pattern: '(?i)\b(?:taught|teaches|teaching|supervised|delivered|designed)\b[^.;\n]{0,60}\b(?:training|bootcamp|certificate|certification|module|lab|prototype|formation|atelier)\b|\b(?:for|during|in|en|pour)\s+(?:a\s+|an\s+)?(?:training|bootcamp|lab|prototype|formation|atelier)\b'
- id: first_hire_title_requires_explicit_role
  description: A first data hire is hiring status, not an engineering job title. Retain the documented hiring status and assert a formal first-role title only when that same title is explicitly established.
  answer_pattern: '(?i)(?:first|premier)\s+(?P<title>data engineer|data scientist|data architect|ingenieur (?:data|donnees)|scientifique des donnees)\b'
  support_pattern: '(?i)(?:first|premier)\s+(?P<title>data engineer|data scientist|data architect|ingenieur (?:data|donnees)|scientifique des donnees)\b'
  binding_groups: [title]
  clause_support: true
  local_negation: true
- id: system_visibility_requires_own_evidence
  negation_pattern: '(?i)\b(?:not|pas|et non)\s+(?:(?:the|a|le|un)\s+)?(?:MongoDB\s+)?CDC\b'
  description: Visibility for an event command center must not be attributed to a CDC pipeline. Retain each system's own documented measurement and explicitly mark unestablished pipeline metrics unknown.
  answer_pattern: '(?i)(?:\bCDC\b[^.;\n]{0,220}(?:minute.level|visibility|visibilite)|(?:minute.level|visibility|visibilite)[^.;\n]{0,220}\bCDC\b)'
  support_pattern: '(?i)(?:\bCDC\b[^.;\n]{0,220}(?:minute.level|visibility|visibilite)|(?:minute.level|visibility|visibilite)[^.;\n]{0,220}\bCDC\b)'
  clause_support: true
  local_negation: true
metric_constraints:
- id: event_volume_average_and_population
  description: The documented average belongs to the Gozem streaming workload, not an established maximum or
    an individually measured CDC pipeline.
  source_spans:
  - 90_website_canon_llms_full.txt:38
  invalid_patterns:
  - (?i)(?:up to|maximum|capacity|at most).{0,35}(?:45\s*million|45\s*M\b)
  - (?i)(?:this production system\s+(?:processed|handled|ingested|averaged)|(?:MongoDB )?CDC (?:pipeline|system)(?:\x27s)?\s+(?:[\w/-]+\s+){0,5}(?:processed|processes|handles|handled|ingests|ingested|averages|averaged|throughput|volume))[^.;\n]{0,80}(?:45\s*million|45\s*M\b)
  - '(?i)(?:streaming workload|45\s*(?:million|m\b))[^.;\n]{0,120}(?:included|includes|including|consist\w* of)[^.;\n]{0,70}(?:MongoDB\s+)?CDC'
- id: streaming_average_wrong_system
  description: The separate streaming workload average does not measure the event command center or market monitoring system. Preserve the explicitly distinct workload population.
  invalid_patterns:
  - '(?i)(?:Vodun|event command center|market monitoring)[^.;\n]{0,120}(?:processed|handles?|averaged|volume|throughput)[^.;\n]{0,50}45\s*(?:million|m\b)'
  - '(?i)45\s*(?:million|m\b)[^.;\n]{0,70}(?:at|for|in|from|by)\s+(?:the\s+)?(?:Vodun|event command center|market monitoring)'
- id: observational_event_matching
  description: The event match rate is observational, without an established causal treatment effect.
  source_spans:
  - 13_gozem_internal_projects.txt:52
  invalid_patterns:
  - (?i)(?:leading to|result(?:ing|ed) in|caused|increased.{0,20}to).{0,80}88\s*%
- id: implementation_status
