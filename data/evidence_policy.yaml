conflicts:
- id: nps_change
  status: owner_confirmed
  query_pattern: (?i)\b(?:nps|net promoter|pantagruel|customer satisfaction)\b
  label: numerical NPS change
  summary: 'Owner-confirmed November 19, 2026: approximately 9 NPS points associated with later initiatives;
    causal lift is not established.'
  source_spans:
  - 04_previous_roles_early.txt:48
  - 01_career_overview.txt:40
  - 90_website_canon_llms_full.txt:320
  redact_pattern: (?im)^.*(?:\bNPS\b|Net Promoter Score).*$
  answer_pattern: (?is)(?:\b(?:8|9|eight|nine|huit|neuf)\s*[- ]?(?:point|points)\b.{0,100}\b(?:NPS|net promoter)|\b(?:NPS|net
    promoter).{0,100}\b(?:8|9|eight|nine|huit|neuf)\s*[- ]?(?:point|points)\b)
  superseded_summary: The NPS change differs between the curated career summaries (8 points, causal wording)
    and the website canon (approximately 9 points, observed association). The magnitude and attribution require
    owner confirmation.
  confirmed_on: '2026-11-19'
  confirmation_source: 19_owner_confirmed_scope.txt
- id: team_growth_baseline
  status: owner_confirmed
  query_pattern: (?i)\b(?:team|headcount|staff|organization|organisation|equipe|effectif|growth|croissance)\b
  label: team-growth baseline and period
  summary: 'Owner-confirmed November 19, 2026: first data hire in 2019; initial team grew to 4 during the Global
    Data Analyst era; 4 to 14+ during Head of Data, October 2022 to March 2025.'
  source_spans:
  - 03_previous_role_gozem_gda.txt:48
  - 13_gozem_internal_projects.txt:77
  - 90_website_canon_llms_full.txt:194
  redact_pattern: (?i)(?:from|de)\s+(?:0|zero|zéro|4|four|quatre)\s+(?:to|a|à)\s+(?:14|fourteen|quatorze)\+?
  answer_pattern: (?i)(?:from|de)\s+(?:0|zero|zéro|4|four|quatre)\s+(?:to|a|à)\s+(?:14|fourteen|quatorze)\+?
  superseded_summary: First-hire foundation, the four-person analyst-era team, and Head of Data expansion are
    different periods. Some curated summaries use 0 to 14+ while the published Head of Data case uses 4 to
    14+. The role-specific growth baseline requires owner confirmation; the documented organization size of
    14+ is not disputed here.
  confirmed_on: '2026-11-19'
  confirmation_source: 19_owner_confirmed_scope.txt
- id: team_geography
  status: owner_confirmed
  query_pattern: (?i)\b(?:countr\w*|geograph\w*|singapore|pays|locations|team|equipe)\b
  label: team-location count
  summary: 'Owner-confirmed November 19, 2026: five African operating markets; Singapore was headquarters only,
    not a team-member work location in this claim.'
  source_spans:
  - 11_leadership_style.txt:25
  - 90_website_canon_llms_full.txt:10
  redact_pattern: (?i)(?:across|in|dans|répartis dans|distributed across)\s+(?:six|6)\s+(?:countries|pays)(?:\s+in
    Sub-Saharan Africa)?
  answer_pattern: (?i)(?:six|6)\s+(?:African countries|countries in Sub-Saharan Africa|pays d.Afrique)
  superseded_summary: Five African operating markets and Singapore headquarters are documented. Whether Singapore
    was also a team-member work location requires owner confirmation. Operating countries, headquarters and
    staff locations must not be conflated.
  confirmed_on: '2026-11-19'
  confirmation_source: 19_owner_confirmed_scope.txt
