request_scopes:
- id: requested_personal_production_scope
  description: The question requests personal production design or operation. An unqualified experience list inherits that setting. For every mentioned tool, provide direct actor/tool/setting proof, an explicitly labeled inventory or project-stack fact, or a locally scoped statement that personal production operation remains unverified. Project leadership does not establish operation of every service.
  query_pattern: '(?is)(?=.*\bproduction\b)(?=.*\b(?:personally|personal|personnellement|personnel\w*)\b)'
  subject_pattern: '(?i)\b(?:AWS EC2|AWS S3|EC2|S3|Pub/Sub|Dataflow|Apache NiFi|NiFi|Spark|Lakeflow)\b'
  subject_aliases:
    ec2: aws ec2
    s3: aws s3
    nifi: apache nifi
  personal_support_pattern: |-
    (?ix)\b(?:Bolaji|he|il)\s+(?:(?:has|had|a|personally|directly|personnellement|directement)\s+){0,3}
    (?:
      (?:uses?|used|operates?|operated|builds?|built|designs?|designed|deploys?|deployed|utilise|exploite|construit|concu|deploye)\s+
      (?P<tools_before>(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow)(?:\s*(?:,|and|et|with|avec)\s*(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow))*)
      (?:\s+(?:pipelines?|systems?|applications?))?\s+(?:in|en)\s+production
    |
      (?:has|had)\s+(?:personal\s+)?production\s+experience\s+with\s+
      (?P<tools_after>(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow)(?:\s*(?:,|and|et)\s*(?:AWS\s+)?(?:EC2|S3|Pub/Sub|Dataflow|Spark|Apache\s+NiFi|NiFi|Lakeflow))*)
    |
      (?:uses?|used|operates?|operated|builds?|built|designs?|designed|deploys?|deployed)\s+(?:a\s+|an\s+)?production\s+
      (?P<tools_front>(?:[\w/+-]+\s+){0,10}?(?:pipelines?|stacks?|systems?|services?|platforms?))
    )
  support_subject_groups: [tools_before, tools_after, tools_front]
  project_support_pattern: '(?is)Gozem Data Hub.{0,900}?(?:published case documents|documented stack (?:includes|contains))\s+(?P<tools>[^.\n]+)'
  project_names:
    data_hub: '(?i)\b(?:Gozem\s+)?Data Hub\b'
    gozem: '(?i)\bGozem\b'
    rintio: '(?i)\bRintio\b'
  project_key: data_hub
  project_reference_pattern: '(?i)^(?:its\b|this (?:project|platform)\b|the (?:documented|published) stack\b)'
  project_anchor_pattern: '(?i)\b(?:Gozem\s+)?Data Hub\b'
  project_answer_pattern: '(?i)(?:documented|published).{0,30}(?:stack|case|part of)|architected and led|stack.{0,15}(?:includes|documents|contains)'
  inventory_label_pattern: '(?i)^\s*(?:listed tools|tool inventory|inventory|documented tool list|outils listes)|\b(?:inventory|tool list|catalogue)\b.{0,30}(?:lists|includes|contains)|(?:appear\w*|listed)\s+in.{0,20}(?:inventory|tool list)'
  exclude_support_pattern: '(?i)\b(?:taught|teaches|teaching|supervised|delivered|designed)\b[^.;\n]{0,60}\b(?:training|bootcamp|module|lab|prototype|formation|atelier)\b|\b(?:for|during|in|en|pour)\s+(?:a\s+|an\s+)?(?:training|bootcamp|lab|prototype|formation|atelier)\b'
  operation_pattern: '(?i)\b(?:personally|operated|operating|operates|use|uses|used|using|designed|designing|designs|deployed|deploys|builds|built|exploite|utilise|concu)\b'
